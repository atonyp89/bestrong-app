<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ironlog</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
</head>
<body>
<div class="app">
  <main class="view" id="view"></main>
  <nav class="nav">
    <div class="resume pill" id="resume">
      <button class="rbtn" data-act="resume" aria-label="Open workout"><svg class="i"><use href="#i-up"/></svg></button>
      <button class="rmid" data-act="resume" aria-label="Open workout">
        <span class="rtitle"><span class="dot" aria-hidden="true"></span><b>Workout</b> <span class="num" data-elapsed-short>0s</span></span>
        <span class="rsub" id="resumeSub"></span>
      </button>
      <button class="rbtn danger" data-act="cancel-workout" aria-label="Discard workout"><svg class="i"><use href="#i-trash"/></svg></button>
    </div>
    <div class="tabs pill" role="tablist">
      <button data-tab="history" id="tab-history"><svg class="i"><use href="#i-history"/></svg>History</button>
      <button data-tab="workout" id="tab-workout"><svg class="i"><use href="#i-bar"/></svg>Workout</button>
      <button data-tab="exercises" id="tab-exercises"><svg class="i"><use href="#i-library"/></svg>Exercises</button>
    </div>
  </nav>
</div>

<section class="sheet" id="live" aria-label="Current workout"></section>
<section class="sheet z2" id="sheet2"></section>
<section class="sheet z3" id="sheet3"></section>
<div class="rest" id="rest"></div>
<div class="confirm" id="confirm"><div class="box" id="confirmBox"></div></div>
<div class="toast" id="toast"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></symbol>
  <!-- Library: two upright books and one leaning, on a shelf -->
  <symbol id="i-library" viewBox="0 0 24 24"><path d="M4 4h4v15H4zM10 4h4v15h-4zM15.6 5.4l3.9-1 3.4 13.6-3.9 1zM2 20.5h20"/></symbol>
  <symbol id="i-bar" viewBox="0 0 24 24"><path d="M2 12h20M5 8v8M8 6v12M16 6v12M19 8v8"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-weight" viewBox="0 0 24 24"><path d="M6 20h12l-2-11H8z"/><circle cx="12" cy="6" r="2.5"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4a3 3 0 0 0 4 4M16 6h4a3 3 0 0 1-4 4M12 13v4M8 20h8"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-2.7-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3.6 15H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.1-2.7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 9 4.6V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
</svg>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
