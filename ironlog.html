<title>Ironlog</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen app shell — scrolling main view, bottom tab bar, full-screen sheets for the live workout and pickers. */
:root {
  --bg: #f3f4f7;
  --surface: #ffffff;
  --surface-2: #e8eaf0;
  --line: #d9dce5;
  --fg: #151821;
  --muted: #6a7083;
  --accent: #2f5bea;
  --accent-ink: #ffffff;
  --accent-soft: #e2e9ff;
  --done: #1f9d5c;
  --done-soft: #dcf3e6;
  --warn: #c7472c;
  --warn-soft: #fbe5df;
  --gold: #b98200;
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 12px;
  --nav-h: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1116; --surface: #181b23; --surface-2: #222632; --line: #2c313e;
    --fg: #eceef4; --muted: #8b91a3; --accent: #6d8dff; --accent-ink: #0b0e18; --accent-soft: #1f2846;
    --done: #3ccf86; --done-soft: #15301f; --warn: #ff7a5c; --warn-soft: #3a1d17; --gold: #f0bf45;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1116; --surface: #181b23; --surface-2: #222632; --line: #2c313e;
  --fg: #eceef4; --muted: #8b91a3; --accent: #6d8dff; --accent-ink: #0b0e18; --accent-soft: #1f2846;
  --done: #3ccf86; --done-soft: #15301f; --warn: #ff7a5c; --warn-soft: #3a1d17; --gold: #f0bf45;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 16px; line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bg); }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.app { height: 100%; display: flex; flex-direction: column; }
.view {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 34px; letter-spacing: .01em; margin: 0; text-transform: uppercase; line-height: 1; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.num { font-variant-numeric: tabular-nums; }
.iconbtn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 999px; color: var(--muted); }
.iconbtn:active { background: var(--surface-2); }

.btn { min-height: 48px; padding: 0 18px; border-radius: var(--r); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn.plain { background: var(--surface-2); }
.btn.danger { background: var(--warn-soft); color: var(--warn); }
.btn.block { width: 100%; }
.btn.sm { min-height: 36px; padding: 0 14px; font-size: 15px; border-radius: 10px; }
.btn:active { filter: brightness(.94); }
.btn[disabled] { opacity: .45; }

.card { background: var(--surface); border-radius: var(--r); border: 1px solid var(--line); }
.tplgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tpl { text-align: left; padding: 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tpl b { font-family: var(--f-display); font-size: 21px; font-weight: 600; line-height: 1.1; }
.tpl .lines { font-size: 14px; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.tag { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; color: var(--muted); }

/* Bottom nav */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.nav .tabs { display: grid; grid-template-columns: repeat(3, 1fr); height: var(--nav-h); max-width: 640px; margin: 0 auto; }
.nav .tabs button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .03em; }
.nav .tabs button[aria-current="page"] { color: var(--accent); }
.resume {
  display: none; width: 100%; padding: 10px max(16px, env(safe-area-inset-left, 0px)); background: var(--accent); color: var(--accent-ink);
  align-items: center; justify-content: space-between; gap: 12px; font-weight: 600;
}
.resume.on { display: flex; }
.resume .t { font-family: var(--f-display); font-size: 20px; }

/* Lists */
.list { display: flex; flex-direction: column; gap: 10px; }
.hist { text-align: left; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; width: 100%; }
.hist .title { font-family: var(--f-display); font-weight: 600; font-size: 22px; line-height: 1.1; }
.stats { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.stats span { display: inline-flex; align-items: center; gap: 5px; }
.stats svg.i { width: 16px; height: 16px; }
.exlines { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-size: 15px; }
.exlines .best { color: var(--muted); text-align: right; }
.pr { display: inline-flex; align-items: center; gap: 3px; color: var(--gold); font-weight: 600; font-size: 12px; letter-spacing: .06em; }
.month { margin-top: 6px; }
.empty { text-align: center; padding: 36px 20px; display: flex; flex-direction: column; gap: 10px; align-items: center; color: var(--muted); }
.empty b { color: var(--fg); font-family: var(--f-display); font-size: 22px; font-weight: 600; }

.search { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: var(--r); padding: 0 12px; min-height: 46px; }
.search input { flex: 1; border: 0; background: none; outline: none; font-size: 16px; min-width: 0; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 7px 14px; border-radius: 999px; background: var(--surface-2); font-size: 14px; font-weight: 600; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.exrow { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; min-height: 60px; }
.exrow .badge { width: 40px; height: 40px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 17px; color: var(--muted); flex: none; }
.exrow .meta { flex: 1; min-width: 0; }
.exrow .meta div:first-child { font-weight: 600; }
.exrow.sel .badge { background: var(--accent); color: var(--accent-ink); }
.letter { font-family: var(--f-display); font-weight: 600; color: var(--muted); font-size: 14px; letter-spacing: .12em; padding: 14px 4px 2px; }

/* Sheets */
.sheet {
  position: fixed; inset: 0; z-index: 30; background: var(--bg);
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  transform: translateY(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1); visibility: hidden;
}
.sheet.open { transform: none; visibility: visible; }
.sheet.z2 { z-index: 35; }
.sheet.z3 { z-index: 40; }
.sheet-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 56px;
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--bg);
}
.sheet-head .mid { flex: 1; min-width: 0; text-align: center; }
.sheet-head .mid b { font-family: var(--f-display); font-size: 20px; font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-body {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(120px + env(safe-area-inset-bottom, 0px));
}
.sheet-foot {
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  border-top: 1px solid var(--line); background: var(--bg);
}
@media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }

/* Live workout */
.wname { font-family: var(--f-display); font-size: 30px; font-weight: 700; text-transform: uppercase; border: 0; background: none; width: 100%; padding: 0; outline: none; line-height: 1.1; }
.clock { font-family: var(--f-display); font-size: 20px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.exblock { display: flex; flex-direction: column; gap: 6px; }
.exhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.exhead .name { font-weight: 600; font-size: 18px; color: var(--accent); text-align: left; min-width: 0; }
.sets { width: 100%; border-collapse: separate; border-spacing: 0 4px; font-variant-numeric: tabular-nums; }
.sets th { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 0 4px; text-align: center; }
.sets th.l { text-align: left; }
.sets td { padding: 0 3px; text-align: center; height: 44px; }
.sets tr.done td { background: var(--done-soft); }
.sets tr.done td:first-child { border-radius: 10px 0 0 10px; }
.sets tr.done td:last-child { border-radius: 0 10px 10px 0; }
.setno { width: 36px; height: 32px; border-radius: 8px; font-weight: 600; font-size: 15px; background: var(--surface-2); }
.setno.w { color: var(--gold); }
.prev { font-size: 14px; color: var(--muted); text-align: left !important; white-space: nowrap; }
.prev button { color: inherit; padding: 6px 0; }
.cell { width: 100%; max-width: 76px; height: 34px; border-radius: 8px; border: 0; background: var(--surface-2); text-align: center; font-size: 16px; font-weight: 600; outline: none; font-variant-numeric: tabular-nums; }
.cell::placeholder { color: var(--muted); opacity: .7; font-weight: 500; }
.cell:focus { box-shadow: 0 0 0 2px var(--accent) inset; }
tr.done .cell { background: transparent; }
.chk { width: 40px; height: 34px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); }
tr.done .chk { background: var(--done); color: #fff; }
.chk svg.i { width: 20px; height: 20px; stroke-width: 3; }
.del { color: var(--muted); width: 30px; height: 34px; display: grid; place-items: center; }
.del svg.i { width: 18px; height: 18px; }
.addset { min-height: 38px; border-radius: 10px; background: var(--surface-2); font-weight: 600; font-size: 15px; width: 100%; }
.exmenu { display: flex; gap: 8px; flex-wrap: wrap; padding: 6px 0 4px; }

/* Rest timer */
.rest {
  display: none; position: fixed; left: 0; right: 0; z-index: 33;
  bottom: 0;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--fg); color: var(--bg);
}
.rest.on { display: block; }
.rest .inner { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.rest .t { font-family: var(--f-display); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; flex: 1; line-height: 1; }
.rest .t small { display: block; font-family: var(--f-body); font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; opacity: .65; }
.rest button { min-height: 40px; padding: 0 12px; border-radius: 10px; background: color-mix(in srgb, var(--bg) 16%, transparent); font-weight: 600; }
.rest .bar { position: absolute; left: 0; top: 0; height: 3px; background: var(--accent); }

/* Forms / misc */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
.text { min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; font-size: 16px; width: 100%; }
textarea.text { padding: 10px 12px; min-height: 120px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; }
.seg button { padding: 7px 16px; border-radius: 8px; font-weight: 600; font-size: 15px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper button { width: 36px; height: 36px; border-radius: 10px; background: var(--surface-2); font-weight: 700; font-size: 18px; }
.stepper span { min-width: 56px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.tplitem { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.tplitem .nm { font-weight: 600; min-width: 0; flex: 1; }
.big { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.big div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; min-width: 0; }
.big b { display: block; font-family: var(--f-display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.big span { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
.spark { width: 100%; height: 120px; display: block; }
.dsets { display: grid; grid-template-columns: 32px 1fr auto; gap: 4px 10px; font-variant-numeric: tabular-nums; font-size: 15px; }
.dsets .n { color: var(--muted); font-weight: 600; }

.demo { padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.demo .stage { position: relative; width: 100%; max-width: 420px; margin: 0 auto; border-radius: 10px; background: var(--surface-2); }
.demo svg { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; max-width: 100%; }
.demo .state { position: absolute; right: 8px; bottom: 8px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.demo ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.demo .muscles { font-size: 14px; color: var(--muted); }
.demo .muscles b { color: var(--fg); font-weight: 600; }

.confirm { position: fixed; inset: 0; z-index: 60; background: rgb(0 0 0 / .45); display: none; align-items: flex-end; justify-content: center; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.confirm.on { display: flex; }
.confirm .box { background: var(--surface); border-radius: 16px; padding: 20px; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
.confirm .box b { font-family: var(--f-display); font-size: 24px; font-weight: 600; }
.confirm .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); z-index: 70; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100% - 32px); }
.toast.on { opacity: 1; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.sync i { width: 8px; height: 8px; border-radius: 99px; background: var(--muted); }
.sync.ok i { background: var(--done); }
</style>

<div class="app">
  <main class="view" id="view"></main>
  <nav class="nav">
    <button class="resume" id="resume" data-act="resume"><span>Workout in progress</span><span class="t num" data-elapsed>0:00</span></button>
    <div class="tabs" role="tablist">
      <button data-tab="history" id="tab-history"><svg class="i"><use href="#i-history"/></svg>History</button>
      <button data-tab="workout" id="tab-workout"><svg class="i"><use href="#i-plus"/></svg>Workout</button>
      <button data-tab="exercises" id="tab-exercises"><svg class="i"><use href="#i-bar"/></svg>Exercises</button>
    </div>
  </nav>
</div>

<section class="sheet" id="live" aria-label="Current workout"></section>
<section class="sheet z2" id="sheet2"></section>
<section class="sheet z3" id="sheet3"></section>
<div class="rest" id="rest"></div>
<div class="confirm" id="confirm"><div class="box" id="confirmBox"></div></div>
<div class="toast" id="toast"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>

</svg>

<script>
(() => {
'use strict';

/* ---------- Exercise library ---------- */
const PARTS = ['Chest', 'Back', 'Legs', 'Shoulders', 'Arms', 'Core'];
const LIB = [
  ['Bench Press', 'Chest', 'Barbell'], ['Incline Bench Press', 'Chest', 'Barbell'], ['Dumbbell Bench Press', 'Chest', 'Dumbbell'],
  ['Incline Dumbbell Press', 'Chest', 'Dumbbell'], ['Chest Fly', 'Chest', 'Dumbbell'], ['Cable Crossover', 'Chest', 'Cable'],

/* ---------- Helpers ---------- */
function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (n, cls = '') => `<svg class="i ${cls}"><use href="#i-${n}"/></svg>`;
const fmtNum = n => (Math.round(n * 10) / 10).toLocaleString(undefined, { maximumFractionDigits: 1 });
const toNum = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const e1rm = (w, r) => (w > 0 && r > 0) ? (r === 1 ? w : w * (1 + r / 30)) : 0;
function clock(ms) {
  const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}` : `${m}:${String(ss).padStart(2, '0')}`;
}
function dur(ms) { const m = Math.round(ms / 60000); return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`; }
function dateLabel(ts) { return new Date(ts).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }); }
function defaultName(ts = Date.now()) {
  const h = new Date(ts).getHours();
  return h < 11 ? 'Morning Workout' : h < 16 ? 'Afternoon Workout' : 'Evening Workout';
}

/* ---------- State ---------- */
const LS = 'ironlog.v1';
let S = load();
function blank() {
  return { settings: { unit: 'kg', rest: 90, t: 0 }, custom: { list: [], t: 0 }, templates: { list: SAMPLE_TEMPLATES, t: 0 }, workouts: [], active: { w: null, t: 0 }, deleted: [] };
}
function load() {
  try { const raw = localStorage.getItem(LS); if (raw) return Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
  return blank();
}
function persistLocal() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }

/* Mark a part of state changed: saves locally now, syncs to the account shortly after. */
function touch(key) {
  const now = Date.now();
  if (key.startsWith('w-')) { const w = S.workouts.find(x => 'w-' + x.id === key); if (w) w.updatedAt = now; }
  else S[key].t = now;
  persistLocal();
  Cloud.queue(key);
}

const allEx = () => LIB.concat(S.custom.list);
const exById = id => allEx().find(e => e.id === id) || { id, name: id, part: '', equip: '' };
const unit = () => S.settings.unit;
function conv(w, from) { const to = unit(); if (w == null || from === to) return w; return from === 'kg' ? Math.round(w * 2.20462 * 2) / 2 : Math.round(w / 2.20462 * 4) / 4; }

/* ---------- Cloud sync (per-person, private) ---------- */
const Cloud = {
  col: null, dirty: new Set(), timer: 0, state: 'local',
  async init() {
    try {
      if (!window.claude || !window.claude.use) return;
      const [user, db] = await Promise.all([claude.use('user'), claude.use('db')]);
      if (!user || !db) return;
      const id = await user.id();
      if (!id) return;
      this.col = db.collection('data/users/' + id);
      const snap = await this.col.get();
      this.merge(snap.docs);
      this.state = 'ok';
      renderAll();
    } catch (e) { this.col = null; }
  },
  merge(docs) {
    const remote = new Map(docs.map(d => [d.id, d.data()]));
    for (const key of ['settings', 'custom', 'templates', 'active']) {
      const r = remote.get(key);
      if (r && r.t > (S[key].t || 0)) { try { S[key] = JSON.parse(r.json); S[key].t = r.t; } catch (e) {} }
      else if (S[key].t) this.dirty.add(key);
    }
    const local = new Map(S.workouts.map(w => ['w-' + w.id, w]));
    for (const [id, r] of remote) {
      if (!id.startsWith('w-') || S.deleted.includes(id)) continue;
      const l = local.get(id);
      if (!l || r.t > (l.updatedAt || 0)) {
        try { const w = JSON.parse(r.json); w.updatedAt = r.t; if (l) Object.assign(l, w); else S.workouts.push(w); } catch (e) {}
      }
    }
    for (const [id, l] of local) { const r = remote.get(id); if (!r || (l.updatedAt || 0) > r.t) this.dirty.add(id); }
    for (const id of S.deleted) this.dirty.add(id);
    S.workouts.sort((a, b) => b.start - a.start);
    persistLocal();
    this.flushSoon();
  },
  queue(key) { this.dirty.add(key); this.flushSoon(); },
  flushSoon() { clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 1200); },
  async flush() {
    if (!this.col) return;
    const keys = [...this.dirty]; this.dirty.clear();
    for (const key of keys) {
      try {
        const ref = this.col.doc(key);
        if (S.deleted.includes(key)) { await ref.delete(); S.deleted = S.deleted.filter(k => k !== key); persistLocal(); continue; }
        let val, t;
        if (key.startsWith('w-')) { const w = S.workouts.find(x => 'w-' + x.id === key); if (!w) continue; val = w; t = w.updatedAt || Date.now(); }
        else { val = S[key]; t = S[key].t || Date.now(); }
        await ref.set({ json: JSON.stringify(val), t });
      } catch (e) { this.dirty.add(key); }
    }
    if (this.dirty.size) this.timer = setTimeout(() => this.flush(), 8000);
  },
};
window.addEventListener('pagehide', () => Cloud.flush());
document.addEventListener('visibilitychange', () => { if (document.hidden) Cloud.flush(); });

/* ---------- History queries ---------- */
const finished = () => S.workouts.filter(w => w.end).sort((a, b) => b.start - a.start);
function workSets(it) { return it.sets.filter(s => s.done && s.type !== 'w'); }
function lastPerformance(exId, beforeTs = Infinity) {
  for (const w of finished()) {
    if (w.start >= beforeTs) continue;
    const it = w.items.find(i => i.ex === exId);
    if (it && it.sets.some(s => s.done)) return { w, sets: it.sets.filter(s => s.done) };
  }
  return null;
}
function volume(w) {
  let v = 0;
  for (const it of w.items) for (const s of workSets(it)) v += conv(s.w || 0, w.unit) * (s.r || 0);
  return v;
}
function bestSet(sets, wUnit) {
  let best = null, score = -1;
  for (const s of sets) { const sc = e1rm(conv(s.w || 0, wUnit), s.r || 0) || (s.r || 0) / 1000; if (sc > score) { score = sc; best = s; } }
  return best;
}
function setLabel(s, wUnit) {
  const w = conv(s.w, wUnit);
  return (w ? `${fmtNum(w)} ${unit()} × ` : '') + `${s.r || 0}`;
}
/* PRs: best estimated 1RM per exercise beating every earlier workout. */
function prsFor(w) {
  const out = [];
  for (const it of w.items) {
    const sets = workSets(it); if (!sets.length) continue;
    const mine = Math.max(...sets.map(s => e1rm(conv(s.w || 0, w.unit), s.r || 0)));
    if (!mine) continue;
    let prior = 0, had = false;
    for (const o of finished()) {
      if (o.start >= w.start) continue;
      const oi = o.items.find(i => i.ex === it.ex); if (!oi) continue;
      for (const s of workSets(oi)) { had = true; prior = Math.max(prior, e1rm(conv(s.w || 0, o.unit), s.r || 0)); }
    }
    if (had && mine > prior + 0.01) out.push(it.ex);
  }
  return out;
}

function spark(vals) {

}

let rest = null;

let audioCtx = null;
function beep() {
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 880; g.gain.setValueAtTime(0.15, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.5);
  } catch (e) {}
}
function renderRest() {
  const el = $('#rest');

  const left = rest.end - Date.now();
  if (left <= 0) { if (!rest.beeped) { rest.beeped = true; beep(); toast('Rest over'); } stopRest(); return; }
  if (!el.classList.contains('on')) {
    el.innerHTML = `<div class="bar" id="restBar"></div><div class="inner"><div class="t"><small>Rest</small><span id="restT">0:00</span></div>

}

    case 'add-ex': openPicker(ids => { ids.forEach(x => w.items.push(itemFor(x))); touch('active'); renderLive(); }); break;
    case 'ex-menu': openMenu = openMenu === +el.dataset.ii ? -1 : +el.dataset.ii; renderLive(); break;
    case 'ex-up': case 'ex-down': { const i = +el.dataset.ii, j = a === 'ex-up' ? i - 1 : i + 1; [w.items[i], w.items[j]] = [w.items[j], w.items[i]]; openMenu = -1; touch('active'); renderLive(); break; }
    case 'ex-remove': w.items.splice(+el.dataset.ii, 1); openMenu = -1; touch('active'); renderLive(); break;
    case 'set-add': { const it = w.items[+el.dataset.ii]; const prev = it.sets[it.sets.length - 1]; it.sets.push({ w: prev ? prev.w : null, r: prev ? prev.r : null, done: false, type: '' }); touch('active'); renderLive(); break; }
    case 'set-del': { const r = rowRef(el); r.it.sets.splice(r.si, 1); touch('active'); renderLive(); break; }
    case 'set-type': { const r = rowRef(el); r.s.type = r.s.type === 'w' ? '' : 'w'; touch('active'); renderLive(); break; }
    case 'set-fill': { const r = rowRef(el); const iw = r.tr.querySelector('[data-f="w"]'), ir = r.tr.querySelector('[data-f="r"]');
      r.s.w = toNum(iw.placeholder); r.s.r = toNum(ir.placeholder); iw.value = r.s.w ?? ''; ir.value = r.s.r ?? ''; touch('active'); break; }
    case 'set-done': {
      const r = rowRef(el);
      if (!r.s.done) {
        const iw = r.tr.querySelector('[data-f="w"]'), ir = r.tr.querySelector('[data-f="r"]');
        if (r.s.w == null && iw.placeholder) r.s.w = toNum(iw.placeholder);
        if (r.s.r == null && ir.placeholder) r.s.r = toNum(ir.placeholder);
        if (!r.s.r) { ir.focus(); toast('Enter reps first'); break; }
        r.s.done = true;
        if (S.settings.rest && r.s.type !== 'w') startRest(S.settings.rest);
        try { navigator.vibrate && navigator.vibrate(15); } catch (e) {}
      } else r.s.done = false;
      touch('active'); renderLive(); break;
    }
    case 'rest-adj': if (rest) { rest.end += +el.dataset.d * 1000; rest.total = Math.max(rest.total, Math.ceil((rest.end - Date.now()) / 1000)); tick(); } break;
    case 'rest-skip': stopRest(); break;

    case 'tpl-open': openTemplate(id); break;
    case 'tpl-start': { const t = S.templates.list.find(x => x.id === id); closeSheet(sheets.s2); startWorkout(newWorkout(t.name, t.items.map(i => itemFor(i.ex, i.sets)))); break; }
    case 'tpl-new': openTplEditor(null); break;
    case 'tpl-edit': openTplEditor(S.templates.list.find(x => x.id === id)); break;
    case 'tpl-sets': { const i = tplDraft.items[+el.dataset.k]; i.sets = Math.max(1, Math.min(12, i.sets + +el.dataset.d)); renderTplEditor(); break; }
    case 'tpl-rm': tplDraft.items.splice(+el.dataset.k, 1); renderTplEditor(); break;
    case 'tpl-add': openPicker(ids => { ids.forEach(x => tplDraft.items.push({ ex: x, sets: 3 })); renderTplEditor(); requestAnimationFrame(() => sheets.s2.classList.add('open')); }); break;
    case 'tpl-save': {
      tplDraft.name = $('#tplName').value.trim();
      if (!tplDraft.name) { $('#tplName').focus(); toast('Give the template a name'); break; }
      if (!tplDraft.items.length) { toast('Add at least one exercise'); break; }
      delete tplDraft.sample;
      const list = S.templates.list, k = list.findIndex(x => x.id === tplDraft.id);
      if (k >= 0) list[k] = tplDraft; else list.push(tplDraft);
      touch('templates'); closeSheet(sheets.s2); renderView(); toast('Template saved'); break;
    }
    case 'tpl-del': ask('Delete template?', `“${tplDraft.name}” will be removed. Logged workouts stay.`, 'Delete', () => {
      S.templates.list = S.templates.list.filter(x => x.id !== tplDraft.id); touch('templates'); closeSheet(sheets.s2); renderView(); toast('Template deleted'); }); break;

    case 'hist-open': openHistory(id); break;
    case 'hist-repeat': { const h = S.workouts.find(x => x.id === id); closeSheet(sheets.s2); startWorkout(newWorkout(h.name, h.items.map(i => itemFor(i.ex, i.sets.length)))); break; }
    case 'hist-tpl': { const h = S.workouts.find(x => x.id === id); closeSheet(sheets.s2);
      setTimeout(() => openTplEditor({ id: 't-' + uid(), name: h.name, items: h.items.map(i => ({ ex: i.ex, sets: i.sets.length })) }), 200); break; }
    case 'hist-del': ask('Delete workout?', 'This removes it from your history and records.', 'Delete', () => {
      S.workouts = S.workouts.filter(x => x.id !== id); S.deleted.push('w-' + id); persistLocal(); Cloud.queue('w-' + id);
      closeSheet(sheets.s2); renderView(); toast('Workout deleted'); }); break;

    case 'ex-open': openExercise(id); break;
    case 'demo-toggle': demo && demo.toggle(); break;
    case 'ex-part': exPart = el.dataset.part; renderView(); break;
    case 'ex-new': openNewExercise(null); break;
    case 'ex-new-pick': openNewExercise(newId => { pick.sel.push(newId); refreshPicker(); }); break;
    case 'nx-part': sheets.s3.querySelectorAll('[data-act="nx-part"]').forEach(c => c.setAttribute('aria-pressed', c === el)); break;
    case 'ex-save': {
      const name = $('#nxName').value.trim();
      if (!name) { $('#nxName').focus(); toast('Enter a name'); break; }
      if (allEx().some(e => e.name.toLowerCase() === name.toLowerCase())) { toast('That exercise already exists'); break; }
      const part = sheets.s3.querySelector('[data-act="nx-part"][aria-pressed="true"]')?.dataset.part || 'Core';
      const ex = { id: 'c-' + uid(), name, part, equip: $('#nxEquip').value.trim() };
      S.custom.list.push(ex); touch('custom'); closeSheet(sheets.s3);
      if (newExAfter) newExAfter(ex.id); else renderView();
      toast('Exercise added'); break;
    }
    case 'ex-del': ask('Delete exercise?', 'It disappears from the list. Past workouts keep their sets.', 'Delete', () => {
      S.custom.list = S.custom.list.filter(e => e.id !== id); touch('custom'); closeSheet(sheets.s2); renderView(); }); break;

    case 'pick-toggle': { const k = pick.sel.indexOf(id); if (k >= 0) pick.sel.splice(k, 1); else pick.sel.push(id); refreshPicker(); break; }
    case 'pick-part': pick.part = el.dataset.part; refreshPicker(); break;
    case 'pick-done': { const ids = pick.sel.slice(); closeSheet(sheets.s2); pick.onDone && pick.onDone(ids); break; }

    case 'unit': S.settings.unit = el.dataset.u; touch('settings'); openSettings(); renderView(); if (S.active.w) renderLive(); break;
    case 'rest-def': S.settings.rest = Math.max(0, Math.min(600, S.settings.rest + +el.dataset.d)); touch('settings');
      $('#restDef').textContent = S.settings.rest ? clock(S.settings.rest * 1000) : 'Off'; break;
    case 'backup-copy': {
      const txt = JSON.stringify({ ironlog: 1, settings: S.settings, custom: S.custom, templates: S.templates, workouts: S.workouts });
      const ta = $('#backupText');
      Promise.resolve().then(() => navigator.clipboard.writeText(txt)).then(() => toast('Backup copied'))
        .catch(() => { ta.value = txt; ta.select(); toast('Select all and copy the text below'); });
      break;
    }
    case 'backup-load': {
      try {
        const d = JSON.parse($('#backupText').value);
        if (!d || d.ironlog !== 1) throw 0;
        ask('Restore backup?', `This replaces your log with ${d.workouts.length} workouts from the backup.`, 'Restore', () => {
          S.settings = d.settings; S.custom = d.custom; S.templates = d.templates;
          S.deleted.push(...S.workouts.filter(o => !d.workouts.some(x => x.id === o.id)).map(o => 'w-' + o.id));
          S.workouts = d.workouts;
          ['settings', 'custom', 'templates'].forEach(touch); S.workouts.forEach(x => touch('w-' + x.id)); S.deleted.forEach(k => Cloud.queue(k));
          closeSheet(sheets.s2); renderAll(); toast('Backup restored');
        }, false);
      } catch (e) { toast('That text is not an Ironlog backup'); }
      break;
    }
  }
});

document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'exSearch') { exQuery = t.value; $('#exList').innerHTML = exListHtml(filteredEx(exQuery, exPart)); return; }
  if (t.id === 'pickSearch') { pick.q = t.value; refreshPicker(); return; }
  if (t.id === 'wname') { S.active.w.name = t.value; touch('active'); return; }
  if (t.classList.contains('cell')) {
    const r = rowRef(t); if (!r) return;
    const v = t.dataset.f === 'r' ? (toNum(t.value) != null ? Math.round(toNum(t.value)) : null) : toNum(t.value);
    r.s[t.dataset.f] = v; touch('active');
  }
});
/* Enter on weight jumps to reps; enter on reps completes the set. */
document.addEventListener('keydown', ev => {
  const t = ev.target;
  if (ev.key !== 'Enter' || !t.classList || !t.classList.contains('cell')) return;
  ev.preventDefault();
  const tr = t.closest('tr');
  if (t.dataset.f === 'w') tr.querySelector('[data-f="r"]').focus();
  else { t.blur(); tr.querySelector('[data-act="set-done"]').click(); }
});
/* Select field contents on focus so typing replaces the value. */
document.addEventListener('focusin', ev => { if (ev.target.classList && ev.target.classList.contains('cell')) setTimeout(() => ev.target.select(), 0); });

/* ---------- Boot ---------- */
renderView();
renderResume();
if (S.active.w) wake(true);
Cloud.init();
})();
</script>
